
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        :root {
          --dark-green: #213321;
          --green-1: #273e27;
          --green-2: #2f4d2f;
          --green-3: #3c603b;
          --green-4: #517b4e;
          --green-5: #789c74;
          --green-6: #9fba9b;
          --green-7: #c7d7c3;
          --green-8: #e3ebe0;
        }
    
        * {
          margin: 0; padding: 0; box-sizing: border-box;
          scroll-behavior: smooth;
        }
    
        body {
          font-family: 'Poppins', sans-serif;
          background-color: var(--green-8);
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
        }
    
        #chatContainer {
          width: 95%;
          max-width: 450px;
          height: 90vh;
          background: var(--green-7);
          border-radius: 20px;
          box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
          display: flex;
          flex-direction: column;
          overflow: hidden;
          position: relative;
        }
    
        #chatOutput {
          flex: 1;
          padding: 20px;
          overflow-y: auto;
          display: flex;
          flex-direction: column;
          gap: 15px;
          background: var(--green-8);
        }
    
        #chatOutput p {
          margin: 0;
          padding: 12px 16px;
          border-radius: 18px;
          max-width: 75%;
          word-wrap: break-word;
          font-size: 14px;
          line-height: 1.5;
          opacity: 0;
          transform: translateY(20px);
          animation: slideIn 0.4s forwards;
        }
    
        .user-message {
          align-self: flex-end;
          background-color: var(--green-4);
          color: white;
          text-align: right;
        }
    
        .bot-message {
          align-self: flex-start;
          background-color: var(--green-6);
          color: #213321;
          text-align: left;
        }
    
        .typing-indicator {
          font-style: italic;
          color: #666;
          align-self: flex-start;
        }
    
        #inputContainer {
          display: flex;
          padding: 10px;
          background: var(--green-7);
          border-top: 1px solid var(--green-5);
          gap: 10px;
        }
    
        #fileInput {
          flex: 1;
          padding: 10px;
          border: 1px solid var(--green-5);
          border-radius: 8px;
          background: white;
          font-size: 14px;
        }
    
        #sendButton {
          background: var(--green-3);
          color: white;
          border: none;
          border-radius: 8px;
          padding: 0 20px;
          cursor: pointer;
          font-size: 16px;
          transition: background 0.3s;
        }
    
        #sendButton:hover {
          background: var(--green-2);
        }
    
        @keyframes slideIn {
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      </style>
    
</head>
<body>
    <div id="chatContainer">
        <div id="chatOutput"></div>
        <div id="inputContainer">
            <textarea id="userInput" placeholder="Type your message"></textarea>
            <button id="sendButton" onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>


    <script>
         let chatHistory = [];
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.startsWith(name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function sendMessage() {
            const userInput = document.getElementById('userInput').value;
            const chatOutput = document.getElementById('chatOutput');
            const csrftoken = getCookie('csrftoken');

            if (userInput.trim() === '') return; // Avoid sending empty messages

            // Add user message
            chatOutput.innerHTML += `<p class="user-message">${userInput}</p>`;

            // Add "Typing..." indicator
            const typingIndicator = document.createElement('p');
            
            typingIndicator.className = 'typing-indicator';
            typingIndicator.textContent = 'Typing...';
            chatOutput.appendChild(typingIndicator);

            // Scroll to the bottom
            chatOutput.scrollTop = chatOutput.scrollHeight;
            chatHistory.push({ role: "user", content: userInput });

            fetch('/chat/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                    'X-CSRFToken': csrftoken,  // Include CSRF token
                },
                body: JSON.stringify({ messages: chatHistory })
            })
            .then(response => response.json())
            .then(data => {
                // Remove "Typing..." indicator
                chatOutput.removeChild(typingIndicator);
                const formattedReply = marked.parse(data.reply);

                // Add bot reply
                chatOutput.innerHTML += `<p class="bot-message">${formattedReply}</p>`;
                chatHistory.push({ role: "assistant", content: data.reply });


                // Scroll to the bottom
                chatOutput.scrollTop = chatOutput.scrollHeight;

                // Clear input and focus the textarea again
                const inputField = document.getElementById('userInput');
                inputField.value = '';
                inputField.focus();  // Keep focus on the input field
            });
        }

        // Send message on Enter key press
        document.getElementById('userInput').addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault(); // Prevent new line
                sendMessage();
            }
        });

        // Display initial bot message on page load
        window.onload = function() {
            const chatOutput = document.getElementById('chatOutput');
            chatOutput.innerHTML += `<p class="bot-message">Hello, I'm a chatbot. Feel free to ask me anything, and I'll be happy to assist you!</p>`;
            chatOutput.scrollTop = chatOutput.scrollHeight; // Scroll to the bottom
        };
    </script>
</body>
</html>
